<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
  <title id="title">Iceberg 表设计与数据变更</title>
  <desc id="desc">用 user_events 表说明 Schema、分区、排序分别改变什么，并比较 Copy-on-Write 与 Merge-on-Read 的文件变化。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#344054"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .subtitle { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; }
      .section { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .label-light { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .card-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .body { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344054; }
      .small { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; }
      .strong { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .mono { font: 500 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #182230; }
      .mono-light { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #FFFFFF; }
      .arrow-label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344054; }
      .green { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #067647; }
      .red { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #B42318; }
      .blue { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #175CD3; }
    </style>
  </defs>

  <rect width="1600" height="1800" fill="#F8FAFC"/>
  <text x="80" y="76" class="title">Iceberg 表设计：四类设计决策分别改变什么</text>
  <text x="80" y="116" class="subtitle">贯穿示例：user_events 按天查询、按用户过滤，并持续接收 CDC 修正。</text>

  <rect x="80" y="154" width="1440" height="92" rx="8" fill="#101828"/>
  <text x="112" y="190" class="label-light">一行事件</text>
  <text x="112" y="224" class="mono-light">event_id=E7, user_id=U42, user_name=Lin, event_time=2026-08-02 10:15</text>

  <text x="80" y="302" class="section">前三类决策：从逻辑列到物理文件布局</text>

  <!-- Schema -->
  <rect x="80" y="336" width="1440" height="250" rx="8" fill="#FFFFFF" stroke="#84CAFF" stroke-width="3" filter="url(#shadow)"/>
  <rect x="80" y="336" width="178" height="250" rx="8" fill="#1570EF"/>
  <text x="112" y="382" class="label-light">决策 1</text>
  <text x="112" y="418" class="label-light">Schema</text>
  <text x="292" y="382" class="card-title">定义“一行有哪些列”，用字段 ID 保持列身份</text>
  <text x="292" y="420" class="body">字段名可以演进；字段 ID 让新 Schema 仍能读懂旧 Parquet 中的列。</text>
  <rect x="292" y="449" width="542" height="101" rx="6" fill="#EFF8FF"/>
  <text x="316" y="480" class="mono">旧 Schema: user_name (field-id=3)</text>
  <text x="316" y="513" class="mono">重命名后: name (field-id=3)</text>
  <text x="316" y="538" class="blue">身份不变，通常只发布新元数据</text>
  <rect x="874" y="449" width="598" height="101" rx="6" fill="#F2F4F7"/>
  <text x="898" y="480" class="strong">它改变：</text>
  <text x="898" y="512" class="small">逻辑行结构、列类型、新旧文件的列映射</text>
  <text x="898" y="538" class="small">旧文件中的物理字节暂时保持原样</text>

  <path d="M800 586 L800 632" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="824" y="618" class="arrow-label">写入时先按分区变换把记录分组</text>

  <!-- Partition -->
  <rect x="80" y="632" width="1440" height="284" rx="8" fill="#FFFFFF" stroke="#FEC84B" stroke-width="3" filter="url(#shadow)"/>
  <rect x="80" y="632" width="178" height="284" rx="8" fill="#DC6803"/>
  <text x="112" y="678" class="label-light">决策 2</text>
  <text x="108" y="714" class="label-light">隐藏分区</text>
  <text x="292" y="678" class="card-title">决定“哪些记录进入同一批文件”</text>
  <text x="292" y="716" class="body">规则 day(event_time) 自动计算分区值；业务 SQL 仍然过滤原始列 event_time。</text>
  <rect x="292" y="750" width="350" height="124" rx="6" fill="#FEF3F2" stroke="#FDA29B"/>
  <text x="316" y="781" class="mono">event_day = 08-01</text>
  <text x="316" y="814" class="mono">A.parquet, B.parquet</text>
  <text x="316" y="850" class="red">查询 08-02：整组跳过</text>
  <rect x="678" y="750" width="350" height="124" rx="6" fill="#ECFDF3" stroke="#75E0A7"/>
  <text x="702" y="781" class="mono">event_day = 08-02</text>
  <text x="702" y="814" class="mono">C.parquet, D.parquet</text>
  <text x="702" y="850" class="green">查询 08-02：保留候选</text>
  <rect x="1064" y="750" width="408" height="124" rx="6" fill="#FFFAEB"/>
  <text x="1088" y="781" class="strong">它改变：</text>
  <text x="1088" y="813" class="small">文件的大范围分组</text>
  <text x="1088" y="841" class="small">规划阶段能否跳过整批文件</text>
  <text x="1088" y="866" class="small">过细会制造小文件与元数据</text>

  <path d="M800 916 L800 962" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="824" y="948" class="arrow-label">同一分区内按排序规则聚集相近值</text>

  <!-- Sort -->
  <rect x="80" y="962" width="1440" height="270" rx="8" fill="#FFFFFF" stroke="#BDB4FE" stroke-width="3" filter="url(#shadow)"/>
  <rect x="80" y="962" width="178" height="270" rx="8" fill="#6938EF"/>
  <text x="112" y="1008" class="label-light">决策 3</text>
  <text x="112" y="1044" class="label-light">排序</text>
  <text x="292" y="1008" class="card-title">决定“同一分区内，相近值如何集中到文件”</text>
  <text x="292" y="1046" class="body">按 user_id 排序后，同一用户的事件更集中，文件列统计更容易排除无关文件。</text>
  <rect x="292" y="1080" width="356" height="108" rx="6" fill="#F4F3FF"/>
  <text x="316" y="1111" class="mono">C.parquet: U001 .. U099</text>
  <text x="316" y="1144" class="mono">D.parquet: U100 .. U199</text>
  <text x="316" y="1174" class="green">查 U142：只保留 D</text>
  <rect x="688" y="1080" width="364" height="108" rx="6" fill="#F2F4F7"/>
  <text x="712" y="1111" class="strong">它改变：</text>
  <text x="712" y="1143" class="small">文件内数据的聚集程度</text>
  <text x="712" y="1171" class="small">列统计的文件裁剪效果与压缩率</text>
  <rect x="1092" y="1080" width="380" height="108" rx="6" fill="#FEF3F2"/>
  <text x="1116" y="1111" class="strong">边界：</text>
  <text x="1116" y="1143" class="small">查询结果顺序仍由 ORDER BY 保证</text>
  <text x="1116" y="1171" class="small">修改规则只影响后续写入与重写</text>

  <text x="80" y="1295" class="section">第四类决策：一行需要更新时，旧行怎样失效</text>

  <!-- COW -->
  <rect x="80" y="1330" width="690" height="354" rx="8" fill="#FFFFFF" stroke="#84CAFF" stroke-width="3" filter="url(#shadow)"/>
  <rect x="80" y="1330" width="690" height="72" rx="8" fill="#175CD3"/>
  <text x="112" y="1376" class="label-light">Copy-on-Write：写入时完成合并</text>
  <text x="112" y="1442" class="strong">更新前</text>
  <rect x="210" y="1416" width="206" height="62" rx="6" fill="#EFF8FF" stroke="#84CAFF"/>
  <text x="234" y="1455" class="mono">A.parquet [E1..E9]</text>
  <path d="M440 1447 L500 1447" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="516" y="1440" class="small">重写包含 E7 的文件</text>
  <text x="516" y="1468" class="small">旧 A 不进入新 Snapshot</text>
  <text x="112" y="1534" class="strong">更新后</text>
  <rect x="210" y="1508" width="206" height="62" rx="6" fill="#ECFDF3" stroke="#75E0A7"/>
  <text x="234" y="1547" class="mono">A2.parquet [E1..E9']</text>
  <text x="112" y="1614" class="green">读：直接读取 A2，查询路径简单</text>
  <text x="112" y="1648" class="red">写：只改一行也可能重写整个数据文件</text>

  <!-- MOR -->
  <rect x="830" y="1330" width="690" height="354" rx="8" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="3" filter="url(#shadow)"/>
  <rect x="830" y="1330" width="690" height="72" rx="8" fill="#C11574"/>
  <text x="862" y="1376" class="label-light">Merge-on-Read：读取时合并删除与新行</text>
  <text x="862" y="1442" class="strong">更新前</text>
  <rect x="960" y="1416" width="206" height="62" rx="6" fill="#FDF2FA" stroke="#F9A8D4"/>
  <text x="984" y="1455" class="mono">A.parquet [E1..E9]</text>
  <path d="M1190 1447 L1250 1447" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1266" y="1440" class="small">保留 A</text>
  <text x="1266" y="1468" class="small">追加删除与新行</text>
  <text x="862" y="1534" class="strong">更新后</text>
  <rect x="960" y="1508" width="158" height="62" rx="6" fill="#F2F4F7" stroke="#98A2B3"/>
  <text x="980" y="1547" class="mono">A.parquet</text>
  <text x="1132" y="1547" class="strong">+</text>
  <rect x="1164" y="1508" width="142" height="62" rx="6" fill="#FEF3F2" stroke="#FDA29B"/>
  <text x="1184" y="1547" class="mono">E7.delete</text>
  <text x="1320" y="1547" class="strong">+</text>
  <rect x="1352" y="1508" width="136" height="62" rx="6" fill="#ECFDF3" stroke="#75E0A7"/>
  <text x="1372" y="1547" class="mono">E7'.data</text>
  <text x="862" y="1614" class="green">写：新增小文件即可快速提交</text>
  <text x="862" y="1648" class="red">读：应用 Delete File 并合并新行，需要后台重写</text>

  <rect x="80" y="1720" width="1440" height="52" rx="8" fill="#E4E7EC"/>
  <text x="108" y="1753" class="strong">记忆链：Schema 管列身份 → 分区管大范围分组 → 排序管局部聚集 → 更新模式管旧行如何失效。</text>
</svg>
