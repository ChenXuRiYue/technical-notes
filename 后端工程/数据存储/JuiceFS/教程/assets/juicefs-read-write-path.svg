<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="900" viewBox="0 0 1400 900"
     role="img" aria-labelledby="title desc">
  <title id="title">JuiceFS 默认读写路径</title>
  <desc id="desc">上传服务经 FUSE 和客户端先将 Block 上传对象存储，再向元数据引擎提交 Slice 映射；另一台客户端打开同一路径后查询元数据，并从本地缓存或对象存储读取 Block。</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#175CD3"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#067647"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .band-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .card-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #101828; }
      .step { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .syscall { fill: none; stroke: #344054; stroke-width: 3; marker-end: url(#arrow-dark); }
      .meta { fill: none; stroke: #175CD3; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-blue); }
      .data { fill: none; stroke: #067647; stroke-width: 4; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#F8FAFC"/>

  <text x="56" y="54" class="title">一个文件怎样写入，又怎样被另一台主机读到？</text>
  <text x="56" y="84" class="subtitle">案例：上传服务发布 /srv/media/inbox/M1001.mp4，转码服务在另一台主机重新打开</text>

  <rect x="40" y="110" width="1320" height="142" rx="8" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="64" y="140" class="band-title">应用层：只使用路径和文件 API</text>

  <rect x="104" y="158" width="330" height="70" rx="6" fill="#FFF7ED" stroke="#FDB022" stroke-width="2"/>
  <text x="128" y="187" class="card-title">上传服务</text>
  <text x="128" y="213" class="body">写入 M1001.mp4</text>

  <rect x="966" y="158" width="330" height="70" rx="6" fill="#FFF7ED" stroke="#FDB022" stroke-width="2"/>
  <text x="990" y="187" class="card-title">转码服务</text>
  <text x="990" y="213" class="body">读取同一路径的字节</text>

  <rect x="40" y="278" width="1320" height="302" rx="8" fill="#F0F9FF" stroke="#84CAFF"/>
  <text x="64" y="310" class="band-title">客户端层：每台主机有独立 JuiceFS Client 与本地缓存</text>

  <rect x="104" y="340" width="410" height="182" rx="6" fill="#FFFFFF" stroke="#2E90FA" stroke-width="2"/>
  <text x="128" y="375" class="card-title">主机 A · JuiceFS Client</text>
  <text x="128" y="407" class="body">FUSE 接收 open / write / close</text>
  <text x="128" y="437" class="body">缓冲写入，定位 Chunk，形成 Slice</text>
  <line x1="128" y1="458" x2="490" y2="458" stroke="#D0D5DD"/>
  <text x="128" y="486" class="small">本地 Block 缓存：只属于主机 A</text>
  <text x="128" y="509" class="small">默认写入不把它当作最终持久副本</text>

  <rect x="886" y="340" width="410" height="182" rx="6" fill="#FFFFFF" stroke="#2E90FA" stroke-width="2"/>
  <text x="910" y="375" class="card-title">主机 B · JuiceFS Client</text>
  <text x="910" y="407" class="body">FUSE 接收 open / read</text>
  <text x="910" y="437" class="body">查 Slice 映射，按有效偏移拼接内容</text>
  <line x1="910" y1="458" x2="1272" y2="458" stroke="#D0D5DD"/>
  <text x="910" y="486" class="small">先查主机 B 本地缓存；未命中再远程 GET</text>
  <text x="910" y="509" class="small">缓存可重建，不与主机 A 共享</text>

  <rect x="40" y="616" width="1320" height="196" rx="8" fill="#F9FAFB" stroke="#98A2B3"/>
  <text x="64" y="648" class="band-title">共享后端：所有客户端访问同一元数据命名空间和对象存储</text>

  <rect x="104" y="680" width="468" height="100" rx="6" fill="#EFF8FF" stroke="#175CD3" stroke-width="2"/>
  <text x="130" y="715" class="card-title">元数据引擎</text>
  <text x="130" y="744" class="body">目录项、inode、权限、锁、Chunk / Slice 映射</text>
  <text x="130" y="768" class="small">数据库保存组织关系，不转发视频 Block</text>

  <rect x="828" y="680" width="468" height="100" rx="6" fill="#ECFDF3" stroke="#067647" stroke-width="2"/>
  <text x="854" y="715" class="card-title">对象存储</text>
  <text x="854" y="744" class="body">持久保存内部编号的 Block 字节</text>
  <text x="854" y="768" class="small">默认最大 Block 4 MiB；实际由卷配置决定</text>

  <path d="M269 228 L269 328" class="syscall"/>
  <circle cx="269" cy="274" r="15" fill="#344054"/>
  <text x="264" y="280" class="step">1</text>
  <rect x="292" y="253" width="182" height="35" rx="4" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="306" y="276" class="label">open / write / close</text>

  <path d="M450 522 C500 584, 706 598, 950 670" class="data"/>
  <circle cx="630" cy="581" r="15" fill="#067647"/>
  <text x="625" y="587" class="step">2</text>
  <rect x="652" y="558" width="278" height="42" rx="4" fill="#FFFFFF" stroke="#A6F4C5"/>
  <text x="668" y="576" class="label">先上传 Block 字节</text>
  <text x="668" y="594" class="small">对象存储确认成功</text>

  <path d="M260 522 C260 578, 300 614, 338 670" class="meta"/>
  <circle cx="286" cy="593" r="15" fill="#175CD3"/>
  <text x="281" y="599" class="step">3</text>
  <rect x="72" y="548" width="190" height="54" rx="4" fill="#FFFFFF" stroke="#B2DDFF"/>
  <text x="88" y="570" class="label">再提交元数据</text>
  <text x="88" y="592" class="small">发布新 Slice 映射</text>

  <path d="M572 760 L760 760 L760 600 L934 530" class="meta"/>
  <circle cx="760" cy="620" r="15" fill="#175CD3"/>
  <text x="755" y="626" class="step">4</text>
  <rect x="782" y="572" width="134" height="36" rx="4" fill="#FFFFFF" stroke="#B2DDFF"/>
  <text x="796" y="596" class="label">open 查询映射</text>

  <path d="M1090 670 L1090 534" class="data"/>
  <circle cx="1090" cy="616" r="15" fill="#067647"/>
  <text x="1085" y="622" class="step">5</text>
  <rect x="1115" y="586" width="196" height="54" rx="4" fill="#FFFFFF" stroke="#A6F4C5"/>
  <text x="1130" y="608" class="label">缓存未命中时</text>
  <text x="1130" y="630" class="small">GET 所需 Block</text>

  <path d="M1131 340 L1131 238" class="syscall"/>
  <circle cx="1131" cy="292" r="15" fill="#344054"/>
  <text x="1126" y="298" class="step">6</text>
  <rect x="912" y="257" width="190" height="35" rx="4" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="928" y="280" class="label">返回最新文件字节</text>

  <line x1="56" y1="850" x2="116" y2="850" class="syscall"/>
  <text x="130" y="856" class="small">系统调用</text>
  <line x1="262" y1="850" x2="322" y2="850" class="meta"/>
  <text x="336" y="856" class="small">元数据请求 / 提交</text>
  <line x1="540" y1="850" x2="600" y2="850" class="data"/>
  <text x="614" y="856" class="small">Block 数据移动</text>
  <text x="866" y="856" class="label">重构句：路径找映射，Block 存字节，默认先传数据再发布引用</text>
</svg>
