<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="execution-title execution-desc">
  <title id="execution-title">Spark Application 从 Driver 到 Task 的执行层级</title>
  <desc id="execution-desc">日报 Application 由 Driver 把 write Action 规划为一个 Job，Job 在按 merchant_id Shuffle 的边界分成扫描聚合 Stage 和最终聚合写出 Stage，两个 Executor 并行执行各分区 Task。</desc>
  <defs>
    <marker id="execution-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#344054"/>
    </marker>
    <marker id="execution-shuffle-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C11574"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; }
      .section { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .box-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344054; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #182230; }
      .arrow-label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344054; }
      .shuffle-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #C11574; }
      .arrow { stroke: #344054; stroke-width: 2.5; fill: none; marker-end: url(#execution-arrow); }
      .shuffle { stroke: #C11574; stroke-width: 3; stroke-dasharray: 8 6; fill: none; marker-end: url(#execution-shuffle-arrow); }
    </style>
  </defs>

  <rect width="1440" height="1060" fill="#F8FAFC"/>
  <text x="64" y="64" class="title">一份日报程序如何变成并行 Task</text>
  <text x="64" y="98" class="subtitle">同一 Application 内：Driver 建计划，Executor 处理分区；Shuffle 将相同 merchant_id 聚到一起</text>

  <rect x="50" y="130" width="1340" height="866" rx="8" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2"/>
  <text x="76" y="168" class="section">Spark Application：daily-order-report-J42</text>

  <!-- Driver -->
  <rect x="86" y="200" width="1268" height="156" rx="8" fill="#EFF8FF" stroke="#1570EF" stroke-width="2"/>
  <text x="112" y="236" class="box-title">Driver</text>
  <text x="112" y="266" class="mono">result.writeTo(...).overwritePartitions()</text>
  <text x="112" y="298" class="body">Action 触发 Job 0；Driver 将物理计划沿 Shuffle 边界分成 Stage 0 和 Stage 1</text>
  <text x="112" y="328" class="small">Driver 保存计划、调度 Task、跟踪失败，并在所有输出 Task 成功后协调 Iceberg 提交</text>

  <!-- Job -->
  <path d="M720 356 L720 402" class="arrow"/>
  <text x="742" y="387" class="arrow-label">触发 Job 0</text>
  <rect x="496" y="402" width="448" height="66" rx="8" fill="#F2F4F7" stroke="#667085" stroke-width="2"/>
  <text x="528" y="432" class="box-title">Job 0：生成 2026-08-12 商户日报</text>
  <text x="528" y="456" class="small">一个 Action 对应的一次完整计算</text>

  <!-- Stages -->
  <path d="M720 468 L720 502 L390 502 L390 536" class="arrow"/>
  <path d="M720 468 L720 502 L1050 502 L1050 536" class="arrow"/>

  <rect x="86" y="536" width="612" height="182" rx="8" fill="#FFFAEB" stroke="#DC6803" stroke-width="2"/>
  <text x="112" y="572" class="box-title">Stage 0：扫描 + 过滤 + 局部聚合</text>
  <text x="112" y="604" class="body">读取 Iceberg 裁剪后的订单文件</text>
  <text x="112" y="632" class="body">每个输入分区先统计本地 merchant_id</text>
  <rect x="112" y="656" width="166" height="40" rx="6" fill="#FFFFFF" stroke="#F79009"/>
  <rect x="302" y="656" width="166" height="40" rx="6" fill="#FFFFFF" stroke="#F79009"/>
  <rect x="492" y="656" width="166" height="40" rx="6" fill="#FFFFFF" stroke="#F79009"/>
  <text x="137" y="682" class="mono">Task 0 / P0</text>
  <text x="327" y="682" class="mono">Task 1 / P1</text>
  <text x="517" y="682" class="mono">Task 2 / P2</text>

  <rect x="742" y="536" width="612" height="182" rx="8" fill="#ECFDF3" stroke="#067647" stroke-width="2"/>
  <text x="768" y="572" class="box-title">Stage 1：最终聚合 + 写出</text>
  <text x="768" y="604" class="body">每个 Shuffle 分区处理一组 merchant_id</text>
  <text x="768" y="632" class="body">生成日报 Data File 并返回 Commit Message</text>
  <rect x="796" y="656" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#12B76A"/>
  <rect x="1080" y="656" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#12B76A"/>
  <text x="821" y="682" class="mono">Task 0 / M01...</text>
  <text x="1105" y="682" class="mono">Task 1 / M02...</text>

  <!-- Shuffle -->
  <path d="M278 696 C340 760 780 760 850 704" class="shuffle"/>
  <path d="M468 696 C540 744 1000 744 1130 704" class="shuffle"/>
  <path d="M658 696 C730 720 880 720 948 704" class="shuffle"/>
  <text x="536" y="750" class="shuffle-label">Shuffle：按 merchant_id 跨 Executor 重分区</text>

  <!-- Executors -->
  <rect x="86" y="798" width="612" height="152" rx="8" fill="#F4F3FF" stroke="#6938EF" stroke-width="2"/>
  <text x="112" y="834" class="box-title">Executor A</text>
  <text x="112" y="866" class="body">用可用 Core 并行运行被分配的 Task</text>
  <text x="112" y="894" class="body">缓存 / Shuffle 文件 / 数据源连接随 Application 存活</text>
  <text x="112" y="924" class="small">Task 失败后，Driver 可以把同一分区交给其他 Executor 重算</text>

  <rect x="742" y="798" width="612" height="152" rx="8" fill="#F4F3FF" stroke="#6938EF" stroke-width="2"/>
  <text x="768" y="834" class="box-title">Executor B</text>
  <text x="768" y="866" class="body">直接从对象存储 / HDFS 读取自己的文件范围</text>
  <text x="768" y="894" class="body">Task 之间不共享 Java 调用栈，通过 Shuffle 交换数据</text>
  <text x="768" y="924" class="small">不要在 Task 中执行无法抵抗重试的外部业务副作用</text>

  <path d="M220 718 L220 790" class="arrow"/>
  <path d="M536 718 L536 790" class="arrow"/>
  <path d="M886 718 L886 790" class="arrow"/>
  <path d="M1210 718 L1210 790" class="arrow"/>

  <rect x="50" y="1010" width="1340" height="34" rx="6" fill="#E4E7EC"/>
  <text x="76" y="1033" class="small">重建模型：Action 产生 Job → Shuffle 划分 Stage → Stage 按分区产生 Task → Executor 执行 Task，Driver 协调结果。</text>
</svg>
